[package]
name = "thingbot-fanroc-game"
version = "0.1.1"
description = "ThingBot FanRoc Game — game mô phỏng độc lập (gói desktop Tauri 2)"
authors = ["ThingEdu"]
license = "AGPL-3.0-only"
repository = "https://github.com/ThingEdu/thingbot-sim"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Chỉ cửa sổ + tệp tĩnh của trang game (theo mẫu thingblock-desktop, không sidecar).
tauri = { version = "2.11.3", features = ["devtools"] }
# Mở link ngoài (mã nguồn AGPL) bằng trình duyệt của máy; quyền mở link giới hạn ở capabilities/default.json.
# 2.5.5: bản mới nhất còn chạy với tauri 2.11 (2.6+ kéo tauri lên 2.12).
tauri-plugin-opener = "=2.5.5"
