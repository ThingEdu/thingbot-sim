[package]
name = "thingbot-fanroc-game"
version = "0.1.0"
description = "ThingBot FanRoc Game — game mô phỏng độc lập (gói desktop Tauri 2)"
authors = ["ThingEdu"]
license = "AGPL-3.0-only"
repository = "https://github.com/ThingEdu/thingbot-sim"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Chỉ cửa sổ + tệp tĩnh của trang game (theo mẫu thingblock-desktop, không sidecar / plugin).
tauri = { version = "2.11.3", features = ["devtools"] }
