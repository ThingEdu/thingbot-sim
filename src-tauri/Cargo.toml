[package]
name = "thingbot-fanroc-game"
version = "0.9.3"
description = "ThingBot FanRoc Game — game mô phỏng độc lập (gói desktop Tauri 2)"
authors = ["ThingEdu"]
license = "AGPL-3.0-only"
repository = "https://github.com/ThingEdu/thingbot-sim"
edition = "2021"
rust-version = "1.77.2"
# Gói còn có bin fanroc-lan-hub (hub LAN cho dev / e2e, cần --features lan-hub) và fanroc-btc-server (cần --features btc-server); app chính là bin này.
default-run = "thingbot-fanroc-game"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Hub LAN chạy riêng cho dev / e2e (src/bin/fanroc-lan-hub.rs): chỉ build khi bật, để tauri build không gói nó vào app.
lan-hub = []
# Máy chủ BTC (HTTP + WebSocket) chạy riêng cho e2e (src/bin/fanroc-btc-server.rs): cũng chỉ build khi bật.
btc-server = []

[[bin]]
name = "fanroc-lan-hub"
path = "src/bin/fanroc-lan-hub.rs"
required-features = ["lan-hub"]

[[bin]]
name = "fanroc-btc-server"
path = "src/bin/fanroc-btc-server.rs"
required-features = ["btc-server"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Chỉ cửa sổ + tệp tĩnh của trang game (theo mẫu thingblock-desktop, không sidecar).
tauri = { version = "2.11.3", features = ["devtools"] }
# Mở link ngoài (mã nguồn AGPL) bằng trình duyệt của máy; quyền mở link giới hạn ở capabilities/default.json.
# 2.5.5: bản mới nhất còn chạy với tauri 2.11 (2.6+ kéo tauri lên 2.12).
tauri-plugin-opener = "=2.5.5"
# Thi hai máy qua LAN (src/lan.rs): hub WebSocket, đèn hiệu UDP, ống nối TCP. tokio đã có sẵn qua tauri.
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "io-util", "macros"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
if-addrs = "0.13"
serde_json = { version = "1", features = ["raw_value"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "=2.4.2"
